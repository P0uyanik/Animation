name: Quality gate

# Delivery plan rev. 2 §5 (T-041; run rules T-086, docs/process/GATE.md §5). One required check: "Gate verdict".
#   plan        trial merge (task branches: origin/staging; integration/*, staging: origin/main), tier fast|full.
#               Task branches (t-*) run the fast tier unless the head commit message contains "[full]".
#               staging/main pushes: if this exact commit already passed the full gate on integration/* (or on
#               staging, for main), every job below is skipped and the verdict reports that run: one full gate
#               run per promotion. No such run: the full gate runs here as before.
#   linux       tools/check_all.py on the trial-merge result: frozen, guarded, write-set, lint, C++ build + tests,
#               Python tests, links, Blender tier (the per-character regression runs in the jobs below)
#   regression  full tier only: one job per character in assets/characters, in parallel (tools/regression/run.py)
#   renderer    the one PLUSH_BUILD_RENDERER=ON build (T-085): frozen engine path tracer, plush-studio, renderer
#               doctest cases and the frozen image regressions; every other job builds with the renderer OFF
#   windows     not here: .github/workflows/windows.yml (nightly + workflow_dispatch, binding on its own result)
#   verdict     combines every report into <= 10 lines and fails if any check or required job failed

on:
  push:
    branches:
      - 't-*'
      - 'integration/*'
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  plan:
    name: Plan (tier)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # tools/ci_status.py verified: look up gate runs for the same commit
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      path_tier: ${{ steps.paths.outputs.tier }}
      capped: ${{ steps.tier.outputs.capped }}
      characters: ${{ steps.paths.outputs.characters }}
      base: ${{ steps.base.outputs.base }}
      merge_target: ${{ steps.base.outputs.merge_target }}
      mode: ${{ steps.verified.outputs.mode || 'run' }}
      verified_run: ${{ steps.verified.outputs.run_id }}
      verified_branch: ${{ steps.verified.outputs.run_branch }}
      verified_detail: ${{ steps.verified.outputs.detail }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true  # repo is private: later `git fetch` steps need the job token (read-only)
      - name: Select comparison base and merge target
        id: base
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: bash .github/scripts/select_base.sh
      - name: Trial merge
        if: steps.base.outputs.merge_target != ''
        run: |
          git -c user.name=ci -c user.email=ci@invalid merge --no-commit --no-ff "${{ steps.base.outputs.merge_target }}" || true
      - name: Classify changed paths
        id: paths
        run: python3 tools/regression/tiers.py --base "${{ steps.base.outputs.base }}" --github-output "$GITHUB_OUTPUT"
      - name: Tier rule (task branches fast unless [full]; "[full]" raises any branch to full)
        id: tier
        env:
          PATH_TIER: ${{ steps.paths.outputs.tier }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          message="$(git log -1 --format=%B HEAD)"
          tier="$PATH_TIER"; capped=false
          if [[ "$message" == *"[full]"* ]]; then
            tier=full
          elif [[ "$REF_NAME" == t-* ]]; then
            tier=fast
            [ "$PATH_TIER" = full ] && capped=true
          fi
          echo "path tier $PATH_TIER -> gate tier $tier (capped=$capped)"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "capped=$capped" >> "$GITHUB_OUTPUT"
      - name: Already verified? (staging and main pushes, GATE.md §5.1)
        id: verified
        if: github.event_name == 'push' && (github.ref_name == 'staging' || github.ref_name == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          CHARACTERS: ${{ steps.paths.outputs.characters }}
        run: |
          # The range this push promotes is <previous tip of this branch>..HEAD. If it contains a full path, the
          # verifying run must have passed every per-character regression job too.
          git merge --abort 2>/dev/null || true
          need_full=true
          if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            tier="$(python3 tools/regression/tiers.py --base "$BEFORE_SHA" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tier"])')"
            [ "$tier" = fast ] && need_full=false
          fi
          # main waits for a gate run of this commit that is still running on staging/integration (both branches
          # are pushed together); staging waits only for integration runs, so the two never wait for each other.
          if [ "$REF_NAME" = main ]; then branches='integration/*,staging'; else branches='integration/*'; fi
          require=()
          [ "$need_full" = true ] && require=(--require-full-for "$CHARACTERS")
          python3 tools/ci_status.py verified --sha "$GITHUB_SHA" --branches "$branches" "${require[@]}" \
            --wait-minutes 150 --github-output "$GITHUB_OUTPUT"

  linux:
    name: linux gate
    needs: plan
    if: needs.plan.outputs.mode == 'run'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true  # repo is private: later `git fetch` steps need the job token (read-only)
      - name: Fetch main and staging
        run: git fetch --no-tags origin +main:refs/remotes/origin/main +staging:refs/remotes/origin/staging
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Cache pinned downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/plush-pinned-dependencies
          key: pinned-linux-${{ hashFiles('.github/ci-dependencies.json') }}
      - name: Cache ccache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Install pinned dependencies (apt C++ libraries without Embree/OIDN, bpy)
        shell: pwsh
        run: ./.github/scripts/install_ci_dependencies.ps1 -Platform linux -Cpp -Bpy
      - name: Trial merge
        id: merge
        shell: bash
        run: bash .github/scripts/trial_merge.sh "${{ needs.plan.outputs.merge_target }}" build/check-all/linux
      - name: Gate
        if: steps.merge.outputs.clean == 'true'
        env:
          CHECK_ALL_BASE_REF: ${{ needs.plan.outputs.base }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          status=clean
          [ -n "${{ needs.plan.outputs.merge_target }}" ] || status=''
          extra=()
          [ "${{ needs.plan.outputs.tier }}" = full ] && extra+=(--full --regression-external "linux regression jobs")
          # Task branch with full paths but no "[full]": the Blender tier is reported as running on the
          # integration branch gate (never silently skipped; GATE.md §5).
          [ "${{ needs.plan.outputs.capped }}" = true ] && extra+=(--blender-on-other-runner \
            "integration/* gate (task branches run the fast tier; add [full] to the commit message to run it here)")
          python tools/check_all.py --base "$CHECK_ALL_BASE_REF" --build-dir build/quality-gate \
            --artifacts-dir build/check-all/linux ${status:+--merge-status $status} "${extra[@]}" || true
          ccache --show-stats | head -5 || true
      - name: Show failing logs
        if: always()
        run: python3 .github/scripts/show_failed_logs.py build/check-all || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-linux
          path: |
            build/check-all/**/*.json
            build/check-all/**/*.txt
            build/check-all/**/*.log
            build/check-all/**/*.png
          if-no-files-found: error
          retention-days: 30

  renderer:
    name: linux renderer
    needs: plan
    if: needs.plan.outputs.mode == 'run'  # T-086: skipped only when this commit already passed on integration/staging
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true  # repo is private: later `git fetch` steps need the job token (read-only)
      - name: Fetch main and staging
        run: git fetch --no-tags origin +main:refs/remotes/origin/main +staging:refs/remotes/origin/staging
      - name: Cache pinned downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/plush-pinned-dependencies
          key: pinned-linux-${{ hashFiles('.github/ci-dependencies.json') }}
      - name: Cache ccache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ccache
          key: ccache-linux-renderer-${{ github.sha }}
          restore-keys: ccache-linux-renderer-
      - name: Install pinned dependencies (apt C++ libraries, Embree, OIDN)
        shell: pwsh
        run: ./.github/scripts/install_ci_dependencies.ps1 -Platform linux -Cpp -Renderer
      - name: Trial merge
        id: merge
        run: bash .github/scripts/trial_merge.sh "${{ needs.plan.outputs.merge_target }}" build/check-all/renderer
      - name: Build and test with the renderer ON
        id: renderer
        if: steps.merge.outputs.clean == 'true'
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          logs=build/check-all/renderer/logs
          mkdir -p "$logs"
          build=fail
          tests=fail
          if { cmake -S . -B build/renderer -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLUSH_BUILD_RENDERER=ON \
                 -DPLUSH_BUILD_STUDIO=ON -DPLUSH_BUILD_TESTS=ON -DPLUSH_OIDN_ROOT="$PLUSH_OIDN_ROOT" &&
               cmake --build build/renderer --parallel; } > "$logs/renderer-build.log" 2>&1 &&
             test -x build/renderer/apps/studio/plush-studio && test -x build/renderer/apps/render-cli/plush-render; then
            build=pass
            ctest --test-dir build/renderer --output-on-failure > "$logs/renderer-ctest.log" 2>&1 && tests=pass
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          tail -n 15 "$logs/renderer-ctest.log" 2>/dev/null || tail -n 40 "$logs/renderer-build.log"
          ccache --show-stats | head -5 || true
      - name: Write renderer report
        if: always()
        env:
          BUILD: ${{ steps.renderer.outputs.build || 'not run' }}
          TESTS: ${{ steps.renderer.outputs.tests || 'not run' }}
        run: |
          # Same check names as the linux gate, so the verdict merges them into its existing lines (<= 10 lines).
          python3 - build/check-all/renderer/check_all.json <<'PY'
          import json, os, sys
          build, tests = os.environ["BUILD"], os.environ["TESTS"]
          checks = [
              {"name": "C++ build", "ok": build == "pass",
               "detail": "" if build == "pass" else f"renderer ON build {build}: see renderer-build.log"},
              {"name": "C++ tests", "ok": tests == "pass",
               "detail": "" if tests == "pass" else f"renderer ON ctest {tests}: see renderer-ctest.log"},
          ]
          verdict = "PASS" if all(c["ok"] for c in checks) else "FAIL"
          json.dump({"schema": "plush.quality-gate/1", "verdict": verdict, "platform": "linux-renderer",
                     "checks": checks, "summary": [f"{'PASS' if c['ok'] else 'FAIL'} {c['name']}" for c in checks]},
                    open(sys.argv[1], "w"), indent=2)
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-renderer
          path: |
            build/check-all/renderer/**/*.json
            build/check-all/renderer/**/*.log
            build/renderer/regression_*.png
          if-no-files-found: error
          retention-days: 30

  regression:
    name: regression ${{ matrix.character }}
    needs: plan
    if: needs.plan.outputs.mode == 'run' && needs.plan.outputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        character: ${{ fromJSON(needs.plan.outputs.characters) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true  # repo is private: later `git fetch` steps need the job token (read-only)
      - name: Fetch main and staging
        run: git fetch --no-tags origin +main:refs/remotes/origin/main +staging:refs/remotes/origin/staging
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Cache pinned downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/plush-pinned-dependencies
          key: pinned-linux-${{ hashFiles('.github/ci-dependencies.json') }}
      - name: Install pinned bpy
        shell: pwsh
        run: ./.github/scripts/install_ci_dependencies.ps1 -Platform linux -Bpy
      - name: Trial merge
        id: merge
        run: bash .github/scripts/trial_merge.sh "${{ needs.plan.outputs.merge_target }}" "build/regression/${{ matrix.character }}"
      - name: Regression and unchanged-character guard
        if: steps.merge.outputs.clean == 'true'
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Flags" | cut -c1-160 || true
          python tools/regression/run.py --blender "$BLENDER" --character "${{ matrix.character }}" \
            --out "build/regression/${{ matrix.character }}" --base origin/main --against origin/main --write-baseline \
            --gate-report "build/regression/${{ matrix.character }}/check_all.json" || true
          python3 .github/scripts/show_failed_logs.py build/regression || true
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-${{ matrix.character }}
          path: |
            build/regression/**/*.json
            build/regression/**/*.log
            build/regression/**/renders/*.png
            build/regression/**/fidelity/sheets/overview.png
            build/regression/**/baselines/**
          if-no-files-found: error
          retention-days: 30

  verdict:
    name: Gate verdict
    if: ${{ !cancelled() }}
    needs: [plan, linux, renderer, regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true  # repo is private: later `git fetch` steps need the job token (read-only)
      - name: Already verified for this commit (no second full run)
        if: needs.plan.outputs.mode == 'verified' || needs.plan.outputs.mode == 'failed'
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          DETAIL: ${{ needs.plan.outputs.verified_detail }}
          RUN_ID: ${{ needs.plan.outputs.verified_run }}
          RUN_BRANCH: ${{ needs.plan.outputs.verified_branch }}
          PLAN: ${{ needs.plan.result }}
        run: |
          mkdir -p build
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          if [ "$MODE" = verified ] && [ "$PLAN" = success ]; then
            line="PASS Already verified: Quality gate run $RUN_ID on $RUN_BRANCH passed for this commit ($url)"
          else
            line="FAIL Already verified: $DETAIL ($url)"
          fi
          printf 'Tier: same commit as %s\n%s\n' "$RUN_BRANCH" "$line" | tee build/combined-summary.txt
          [[ "$line" == PASS* ]]
      - name: Download reports
        if: needs.plan.outputs.mode != 'verified' && needs.plan.outputs.mode != 'failed'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: build/combined
      - name: Combine reports into at most ten lines and decide
        if: needs.plan.outputs.mode != 'verified' && needs.plan.outputs.mode != 'failed'
        env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.plan.outputs.tier }}
          CHARACTERS: ${{ needs.plan.outputs.characters }}
        run: |
          # Windows: .github/workflows/windows.yml (nightly + workflow_dispatch), binding on its own result.
          python .github/scripts/combine_check_reports.py build/combined build/combined-summary.txt \
            --needs-json "$NEEDS" --tier "$TIER" --characters "$CHARACTERS" --windows false
      - name: Job summary
        if: always()
        run: |
          { echo '```'; cat build/combined-summary.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Update the one PR #2 comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          SUMMARY_PATH: build/combined-summary.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- plush-quality-gate -->';
            const summary = fs.readFileSync(process.env.SUMMARY_PATH, 'utf8').trimEnd();
            const body = `${context.ref.replace('refs/heads/', '')} ${context.sha.slice(0, 7)}\n${summary} ${marker}`;
            const issue_number = 2;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, body
              });
            }
