name: Quality gate

# Delivery plan rev. 2 §5 (T-041). One required check: "Gate verdict".
#   plan        trial merge (task branches: origin/staging; integration/*, staging: origin/main), tier fast|full
#   linux       tools/check_all.py on the trial-merge result: frozen, guarded, write-set, lint, C++ build + tests,
#               Python tests, links, Blender tier (the per-character regression runs in the jobs below)
#   regression  full tier only: one job per character in assets/characters, in parallel (tools/regression/run.py)
#   windows     staging/main pushes (or "[ci windows]" in the head commit message): C++ and Python tiers
#   verdict     combines every report into <= 10 lines and fails if any check or required job failed

on:
  push:
    branches:
      - 't-*'
      - 'integration/*'
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  plan:
    name: Plan (tier)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      characters: ${{ steps.tier.outputs.characters }}
      base: ${{ steps.base.outputs.base }}
      merge_target: ${{ steps.base.outputs.merge_target }}
      windows: ${{ steps.base.outputs.windows }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select comparison base and merge target
        id: base
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: bash .github/scripts/select_base.sh
      - name: Trial merge
        if: steps.base.outputs.merge_target != ''
        run: |
          git -c user.name=ci -c user.email=ci@invalid merge --no-commit --no-ff "${{ steps.base.outputs.merge_target }}" || true
      - name: Classify changed paths
        id: tier
        run: python3 tools/regression/tiers.py --base "${{ steps.base.outputs.base }}" --github-output "$GITHUB_OUTPUT"

  linux:
    name: linux gate
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch main and staging
        run: git fetch --no-tags origin +main:refs/remotes/origin/main +staging:refs/remotes/origin/staging
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Cache pinned downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/plush-pinned-dependencies
          key: pinned-linux-${{ hashFiles('.github/ci-dependencies.json') }}
      - name: Cache ccache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Install pinned dependencies (apt C++ libraries, OIDN, bpy)
        shell: pwsh
        run: ./.github/scripts/install_ci_dependencies.ps1 -Platform linux -Cpp -Bpy
      - name: Trial merge
        id: merge
        shell: bash
        run: bash .github/scripts/trial_merge.sh "${{ needs.plan.outputs.merge_target }}" build/check-all/linux
      - name: Gate
        if: steps.merge.outputs.clean == 'true'
        env:
          CHECK_ALL_BASE_REF: ${{ needs.plan.outputs.base }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          status=clean
          [ -n "${{ needs.plan.outputs.merge_target }}" ] || status=''
          extra=()
          [ "${{ needs.plan.outputs.tier }}" = full ] && extra+=(--regression-external "linux regression jobs")
          python tools/check_all.py --base "$CHECK_ALL_BASE_REF" --build-dir build/quality-gate \
            --artifacts-dir build/check-all/linux ${status:+--merge-status $status} "${extra[@]}" || true
          ccache --show-stats | head -5 || true
      - name: Show failing logs
        if: always()
        run: python3 .github/scripts/show_failed_logs.py build/check-all || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-linux
          path: |
            build/check-all/**/*.json
            build/check-all/**/*.txt
            build/check-all/**/*.log
            build/check-all/**/*.png
          if-no-files-found: error
          retention-days: 30

  regression:
    name: regression ${{ matrix.character }}
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        character: ${{ fromJSON(needs.plan.outputs.characters) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch main and staging
        run: git fetch --no-tags origin +main:refs/remotes/origin/main +staging:refs/remotes/origin/staging
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Cache pinned downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/plush-pinned-dependencies
          key: pinned-linux-${{ hashFiles('.github/ci-dependencies.json') }}
      - name: Install pinned bpy
        shell: pwsh
        run: ./.github/scripts/install_ci_dependencies.ps1 -Platform linux -Bpy
      - name: Trial merge
        id: merge
        run: bash .github/scripts/trial_merge.sh "${{ needs.plan.outputs.merge_target }}" "build/regression/${{ matrix.character }}"
      - name: Regression and unchanged-character guard
        if: steps.merge.outputs.clean == 'true'
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Flags" | cut -c1-160 || true
          python tools/regression/run.py --blender "$BLENDER" --character "${{ matrix.character }}" \
            --out "build/regression/${{ matrix.character }}" --base origin/main --against origin/main --write-baseline \
            --gate-report "build/regression/${{ matrix.character }}/check_all.json" || true
          python3 .github/scripts/show_failed_logs.py build/regression || true
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-${{ matrix.character }}
          path: |
            build/regression/**/*.json
            build/regression/**/*.log
            build/regression/**/renders/*.png
            build/regression/**/fidelity/sheets/overview.png
            build/regression/**/baselines/**
          if-no-files-found: error
          retention-days: 30

  windows:
    name: windows gate
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch main and staging
        run: git fetch --no-tags origin +main:refs/remotes/origin/main +staging:refs/remotes/origin/staging
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Trial merge
        id: merge
        shell: bash
        run: |
          bash .github/scripts/trial_merge.sh "${{ needs.plan.outputs.merge_target }}" build/check-all/windows
          grep -qx 'clean=true' "$GITHUB_OUTPUT"
          echo "Windows branch commit $(git rev-parse HEAD), branch tree $(git rev-parse 'HEAD^{tree}'), tested tree $(git write-tree)" >> "$GITHUB_STEP_SUMMARY"
      - name: Cache pinned downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/plush-pinned-dependencies
          key: pinned-windows-${{ hashFiles('.github/ci-dependencies.json') }}
      - name: Locate VS 2022 and vcpkg
        id: tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'VS 2022 x64 tools missing' }
          $msvc = (Get-Content "$vs/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          $vcpkg = (Get-Item $env:VCPKG_INSTALLATION_ROOT).FullName.Replace('\', '/')
          $ports = git -c "safe.directory=$vcpkg" -C $vcpkg rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_VISUAL_STUDIO_PATH=$vs" >> $env:GITHUB_ENV
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          "abi=x64-windows-$msvc-$ports" >> $env:GITHUB_OUTPUT
      - name: Restore vcpkg binary packages
        id: packages
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ steps.tools.outputs.abi }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ steps.tools.outputs.abi }}-
      - name: Install pinned dependencies (OIDN, vcpkg manifest)
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          ./.github/scripts/install_ci_dependencies.ps1 -Platform windows -Cpp
          # The manifest toolchain reuses this same install tree during CMake configuration.
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg" install --triplet x64-windows "--x-install-root=$pwd/build/quality-gate/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save vcpkg binary packages
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Gate (C++ and Python; the Blender tier and regression run on linux)
        if: steps.merge.outputs.clean == 'true'
        shell: pwsh
        env:
          CHECK_ALL_BASE_REF: ${{ needs.plan.outputs.base }}
          CMAKE_GENERATOR: Ninja
          CC: cl
          CXX: cl
        run: |
          & "$env:VCPKG_VISUAL_STUDIO_PATH/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $mergeArgs = if ('${{ needs.plan.outputs.merge_target }}') { '--merge-status', 'clean' }
          python tools/check_all.py --base "$env:CHECK_ALL_BASE_REF" --build-dir build/quality-gate --artifacts-dir build/check-all/windows --blender-on-other-runner "linux gate" @mergeArgs
          exit $LASTEXITCODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-windows
          path: |
            build/check-all/**/*.json
            build/check-all/**/*.txt
            build/check-all/**/*.log
          if-no-files-found: error
          retention-days: 30

  verdict:
    name: Gate verdict
    if: ${{ !cancelled() }}
    needs: [plan, linux, regression, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download reports
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: build/combined
      - name: Combine reports into at most ten lines and decide
        env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.plan.outputs.tier }}
          CHARACTERS: ${{ needs.plan.outputs.characters }}
          # Windows has never been green on GitHub yet (vcpkg cold build > 2 h before T-041): reported, not
          # required. Change to "${{ needs.plan.outputs.windows }}" once it has passed on staging.
          WINDOWS: ${{ needs.plan.outputs.windows == 'true' && 'informational' || 'false' }}
        run: |
          python .github/scripts/combine_check_reports.py build/combined build/combined-summary.txt \
            --needs-json "$NEEDS" --tier "$TIER" --characters "$CHARACTERS" --windows "$WINDOWS"
      - name: Job summary
        if: always()
        run: |
          { echo '```'; cat build/combined-summary.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Update the one PR #2 comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          SUMMARY_PATH: build/combined-summary.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- plush-quality-gate -->';
            const summary = fs.readFileSync(process.env.SUMMARY_PATH, 'utf8').trimEnd();
            const body = `${context.ref.replace('refs/heads/', '')} ${context.sha.slice(0, 7)}\n${summary} ${marker}`;
            const issue_number = 2;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, body
              });
            }
