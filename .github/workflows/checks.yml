name: Quality gate

on:
  push:
    branches:
      - 't-*'
      - 'integration/*'
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            triplet: x64-linux
          - os: windows-2025
            platform: windows
            triplet: x64-windows
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main without writing a branch
        shell: pwsh
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Select the guarded-path comparison base
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          $base = 'origin/main'
          $zero = '0000000000000000000000000000000000000000'
          if ($env:CURRENT_REF -eq 'refs/heads/main') {
            $base = if ($env:BEFORE_SHA -and $env:BEFORE_SHA -ne $zero) { $env:BEFORE_SHA } else { 'HEAD^' }
          }
          "CHECK_ALL_BASE_REF=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Verify OIDN and install pinned bpy
        shell: pwsh
        run: ./.github/scripts/install_ci_dependencies.ps1 -Platform '${{ matrix.platform }}'

      - name: Install pinned vcpkg manifest
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg" install --triplet '${{ matrix.triplet }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check task branch
        id: branch_gate
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/check_all.py --base "$env:CHECK_ALL_BASE_REF" --build-dir build/quality-gate/branch --artifacts-dir build/check-all/branch
          exit $LASTEXITCODE

      - name: Trial merge origin/main
        id: merge
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/check-all/trial | Out-Null
          git merge --no-commit origin/main
          if ($LASTEXITCODE -eq 0) {
            "clean=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $files = @(git diff --name-only --diff-filter=U)
          $status = if ($files.Count) { "CONFLICT in " + ($files -join ', ') } else { 'CONFLICT (files unavailable)' }
          "FAIL Merge status: $status" | Set-Content -Encoding utf8 build/check-all/trial/summary.txt
          $report = [ordered]@{
            schema = 'plush.quality-gate/1'
            verdict = 'FAIL'
            platform = '${{ matrix.platform }}'
            checks = @([ordered]@{ name = 'Merge status'; ok = $false; detail = $status })
            summary = @("FAIL Merge status: $status")
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 build/check-all/trial/check_all.json
          "clean=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check trial-merged result identically
        id: trial_gate
        if: steps.merge.outputs.clean == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/check_all.py --base "$env:CHECK_ALL_BASE_REF" --build-dir build/quality-gate/trial --artifacts-dir build/check-all/trial --merge-status clean
          exit $LASTEXITCODE

      - name: Upload report and small renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ matrix.platform }}
          path: |
            build/check-all/**/*.json
            build/check-all/**/*.txt
            build/check-all/**/*.log
            build/check-all/**/*.png
            build/check-all/**/*.jpg
            build/check-all/**/*.webp
          if-no-files-found: error
          retention-days: 30

      - name: Fail unsuccessful gate
        if: steps.branch_gate.outcome != 'success' || steps.merge.outputs.clean != 'true' || steps.trial_gate.outcome != 'success'
        shell: pwsh
        run: exit 1

  report:
    name: PR summary
    if: always()
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out reporting script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download OS reports
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: quality-*
          path: build/combined

      - name: Combine reports into at most ten lines
        run: python .github/scripts/combine_check_reports.py build/combined build/combined-summary.txt

      - name: Create or update the one PR #2 comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          SUMMARY_PATH: build/combined-summary.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- plush-quality-gate -->';
            const summary = fs.readFileSync(process.env.SUMMARY_PATH, 'utf8').trimEnd();
            const body = `${summary} ${marker}`;
            const issue_number = 2;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, body
              });
            }
