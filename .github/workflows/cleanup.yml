name: Branch cleanup

# T-048 / DELIVERY_PLAN §8.2. Deletes ONLY branches listed in cleanup/REQUEST.json on branch `cleanup-request`, and
# only if tools/cleanup/select.py (taken from main, never from the request branch) says every condition holds.
# No schedule and no wildcard deletion. Docs: docs/process/CLEANUP.md.

on:
  push:
    branches: [cleanup-request]
    paths: [cleanup/REQUEST.json]
  workflow_dispatch:

permissions:
  contents: write   # delete listed branches, pin them with backup/ tags, commit logs to cleanup-request
  actions: read     # read backup.yml results and confirm earlier dry-run runs

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  self-test:
    name: Cleanup self-test (scratch repositories only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out main (tools and tests come from main only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Run cleanup unit and end-to-end tests
        run: python3 tools/cleanup/run_tests.py

  cleanup:
    name: Branch cleanup
    needs: self-test
    if: github.ref == 'refs/heads/cleanup-request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      WORK: ${{ runner.temp }}/cleanup
    steps:
      - name: Check out main (tools, TASK_LOG)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Check out cleanup-request (request, logs; pushes go through this clone)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: cleanup-request
          path: request
          fetch-depth: 0

      - name: Guard - request branch must run the workflow from main
        run: |
          git -C request fetch --no-tags origin main:refs/remotes/origin/main staging:refs/remotes/origin/staging || \
            git -C request fetch --no-tags origin main:refs/remotes/origin/main
          if ! git -C request diff --quiet refs/remotes/origin/main HEAD -- .github/workflows/cleanup.yml; then
            echo "::error::.github/workflows/cleanup.yml on cleanup-request differs from main; merge main into cleanup-request first"
            exit 1
          fi
          test -f request/cleanup/REQUEST.json || { echo "::error::cleanup/REQUEST.json missing on cleanup-request"; exit 1; }

      - name: Gather backup.yml results, open tasks and dry-run confirmations
        run: |
          mkdir -p "$WORK"
          # Missing file = lookup failed; empty list = never ran. Both refuse every deletion.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/backup.yml/runs?branch=main&per_page=30" \
            > "$WORK/backup-runs.json" || rm -f "$WORK/backup-runs.json"
          # Open rows of TASK_LOG on main AND staging protect their branches (union = conservative).
          cp main/docs/process/TASK_LOG.md "$WORK/TASK_LOG.md"
          git -C request show refs/remotes/origin/staging:docs/process/TASK_LOG.md >> "$WORK/TASK_LOG.md" 2>/dev/null || true
          echo '{}' > "$WORK/verified.json"
          for id in $(python3 main/tools/cleanup/cleanup.py runs-to-verify --request request/cleanup/REQUEST.json \
                        --dry-run-log request/cleanup/DRY_RUN_LOG.jsonl); do
            case "$id" in (*[!0-9]*|'') continue;; esac
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" > "$WORK/run-${id}.json" || continue
            python3 - "$WORK/verified.json" "$id" "$WORK/run-${id}.json" <<'EOF'
          import json, sys
          path, run_id, run_file = sys.argv[1:]
          data = json.load(open(path))
          run = json.load(open(run_file))
          data[run_id] = {k: run.get(k) for k in ("id", "path", "conclusion", "status", "head_branch")}
          json.dump(data, open(path, "w"))
          EOF
          done

      - name: Decide and (in mode delete) delete
        id: cleanup
        run: |
          git -C request config user.name "github-actions[bot]"
          git -C request config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 main/tools/cleanup/cleanup.py run --repo request --remote origin \
            --request request/cleanup/REQUEST.json --task-log "$WORK/TASK_LOG.md" \
            --backup-runs "$WORK/backup-runs.json" --verified-runs "$WORK/verified.json" \
            --dry-run-log request/cleanup/DRY_RUN_LOG.jsonl --cleanup-log request/docs/process/CLEANUP_LOG.md \
            --summary "$GITHUB_STEP_SUMMARY" --run-id "$GITHUB_RUN_ID" --decisions-json "$WORK/decisions.json" \
            --allow-delete

      - name: Commit logs to cleanup-request (never to main)
        if: always()
        run: |
          cd request
          for log in cleanup/DRY_RUN_LOG.jsonl docs/process/CLEANUP_LOG.md; do
            if [ -f "$log" ]; then git add -- "$log"; fi
          done
          if git diff --cached --quiet; then echo "no log changes"; exit 0; fi
          git commit -q -m "cleanup: log for run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:refs/heads/cleanup-request; then exit 0; fi
            sleep $((attempt * 5))
            git pull --no-rebase --no-edit origin cleanup-request
          done
          echo "::error::could not push the cleanup logs; see the job summary for the SHAs"
          exit 1

      - name: Upload decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cleanup-decisions-${{ github.run_id }}
          path: ${{ runner.temp }}/cleanup/
          if-no-files-found: ignore
          retention-days: 90
