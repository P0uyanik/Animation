name: Bake package

# T-205: bake a shot on a Linux runner and publish a bake package (plush.bake_package/1) as an artifact, so the
# owner's PC renders it with Blender alone (tools/pc/render_package.py) - no engine executable on the PC.
# Manual only. No secrets; read-only token. Steps: pinned C++ deps + bpy (same installer as the quality gate),
# build plush-render, run_shot prepare + bake via pipeline/production/bake_package.py, smoke-render a few frames
# from the unpacked zip, upload the zip and its sha256.

on:
  workflow_dispatch:
    inputs:
      shot:
        description: 'Shot file (repository path)'
        type: string
        default: 'episodes/e912_paper_boat/shots/s010/shot.scene.json'
      frames:
        description: 'Frames to bake, A-B (empty: the whole shot)'
        type: string
        default: ''
      smoke:
        description: 'Frames to smoke-render from the package on the runner, A-B (empty: skip)'
        type: string
        default: '1-2'

permissions:
  contents: read

jobs:
  bake:
    name: Bake package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned dependencies (apt C++ libraries, bpy)
        shell: pwsh
        run: ./.github/scripts/install_ci_dependencies.ps1 -Platform linux -Cpp -Bpy
      - name: Build the bake engine (plush-render)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLUSH_BUILD_STUDIO=OFF -DPLUSH_BUILD_TESTS=OFF
          cmake --build build --parallel --target plush-render
      - name: Prepare, bake and pack
        env:
          SHOT: ${{ inputs.shot }}
          FRAMES: ${{ inputs.frames }}
          SMOKE: ${{ inputs.smoke }}
        run: |
          args=(--shot "$SHOT" --blender "$BLENDER" --bake-engine build/apps/render-cli/plush-render --out build/bake_packages)
          [ -n "$FRAMES" ] && args+=(--frames "$FRAMES")
          [ -n "$SMOKE" ] && args+=(--smoke "$SMOKE")
          python pipeline/production/bake_package.py "${args[@]}"
          { echo '### Bake package'; echo '```'; cat build/bake_packages/*.bake.zip.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bake package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bake-package
          path: |
            build/bake_packages/*.bake.zip
            build/bake_packages/*.bake.zip.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
